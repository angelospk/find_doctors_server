name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: vet
        run: go vet ./...
      - name: test (-race)
        run: go test -race -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          # Compile golangci-lint with the job's Go toolchain instead of
          # downloading a prebuilt binary. The prebuilt v2.x binaries are built
          # with an older Go, and golangci-lint refuses to run when its build
          # Go is lower than the go.mod target (1.26).
          install-mode: goinstall
